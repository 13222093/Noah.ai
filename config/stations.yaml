# Noah AI station configuration (B-034, decision D12).
#
# Single source of truth for station metadata, datum notes and Siaga
# thresholds. Code reads thresholds only from here (noah.store.stations);
# no threshold literal belongs anywhere else. Validate with:
#     python -m noah.store.stations
# Load into the database (stations + station_identifiers) with:
#     python -m noah.store.stations --apply      # needs NOAH_DATABASE_URL
#
# Coverage: the 37 posts on the Posko Banjir DSDA page (S1) as saved on
# 2026-11-02 (ml-service/tests/connectors/fixtures/s1_posko_banjir_20261102T1342Z.html),
# plus PS. Cipinang Hulu, which is in the S2 archive but no longer on the page.
#
# Identities: the home identity of an S1 post is (s1_posko_banjir, ID_PINTU_AIR),
# e.g. Manggarai "122", as emitted by the S1 connector. The S2 archive label
# (ml-service/data/tma_2020.xlsx.csv, whitespace trimmed) is an alias, so both
# feeds resolve to the same station. Labels were matched by name, river and
# coordinates (S2 "P.A. Marina Ancol", lokasi Laut, has the exact coordinates
# of S1 203 "P.A. Marina Ancol 1 (Laut)").
#
# Units: water level in cm relative to the station's gauge zero. The S1 page
# publishes raw levels and Siaga values in mm (Manggarai 5340 raw vs 534 cm in
# the table; Siaga 9500/8500/7500 mm = 950/850/750 cm); evidence.s1_page_mm
# keeps them verbatim and the *_cm values are those divided by 10.
#
# siaga_thresholds.source:
#   dsda_official           DSDA's official table (plan 04). Manggarai.
#   dsda_posko_banjir_page  values DSDA publishes on the Posko Banjir page
#                           (2026-11-02). Published by DSDA but not formally
#                           confirmed, so needs_DSDA_confirmation: true.
#   derived_from_S2_2020    inferred from the S2 status_siaga labels
#                           (noah.importers.s2_tma_2020.derive_siaga_thresholds);
#                           kept as evidence.s2_2020, currently not used as the
#                           value of any post.
#   null                    unknown, never guessed. Includes the newer posts
#                           whose page values are a 5000/5000/5000 mm placeholder.
# A null level means "unknown", not "no such level".
#
# evidence.s2_2020 is the 2020 picture: per level, the highest level seen with
# a lower status, the lowest level seen at this status (cm), and the value the
# derivation rule pins down, if any. It agrees with the page at 13 posts and
# differs at Cibalok (Siaga 3: 140 in 2020, 90 now) and Jembatan Merah (Siaga
# 2/1: 150/200 in 2020, 200/250 now). Thresholds therefore change over time:
# a 2020 backtest must use the 2020 values, not these.
#
# comparison ">=": the S2 labels show exactly 750 cm at Manggarai as Siaga 3,
# so DSDA applies "level >= threshold". Plan 04 words it as "above"; DSDA to
# confirm. It only matters at exactly the threshold value.

version: 1

# Range checks that set quality_flag (flag, never drop). Not hydrology.
qc:
  spike_cm: 100            # isolated reading >= 100 cm away from both neighbours
  spike_max_gap_minutes: 180

stations:
  - code: cibalok_gadog
    name: "Bendung. Cibalok - Gadog 1"
    kind: tma
    river: "Ciliwung"
    source: s1_posko_banjir
    external_id: "155"  # ID_PINTU_AIR on the Posko Banjir page
    external_id_confirmed: true
    aliases:
      - {source: s2_opendata, external_id: "PA. Cibalok - Gadog", confirmed: true}
    location: {lat: -6.653375, lon: 106.869567, source: s1_posko_banjir_page_2026-11-02, needs_verification: true}
    unit: cm
    datum_note: >-
      Gauge zero of the post; vertical datum not documented (DSDA Q2).
      S2 has 218 negative readings here; they are flagged suspect until the
      datum is confirmed.
    allows_negative: false
    siaga_thresholds:
      source: dsda_posko_banjir_page
      reference: ml-service/tests/connectors/fixtures/s1_posko_banjir_20261102T1342Z.html
      needs_DSDA_confirmation: true
      note: "differs from S2 2020 at siaga_3 (thresholds changed since 2020, or the gauge did)"
      comparison: ">="
      siaga_3_cm: 90
      siaga_2_cm: 160
      siaga_1_cm: 210
      evidence:
        s1_page_mm: {siaga_3: 900, siaga_2: 1600, siaga_1: 2100}
        s2_2020:  # derived from status_siaga labels, cm
          siaga_3: {max_below_cm: 136, min_at_cm: 144, value_cm: 140, result: "unambiguous"}
          siaga_2: {max_below_cm: 147, min_at_cm: 159, value_cm: null, result: "bracket wider than 10 cm"}
          siaga_1: {max_below_cm: 159, min_at_cm: null, value_cm: null, result: "level not observed"}

