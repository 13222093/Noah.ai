    nearest_posts_km:
      - {post: "Pompa Yos Sudarso 1", river: "Sunter Timur", km: 1.4}
      - {post: "PA. Pulo Gadung", river: "Sunter", km: 3.7}
    scores: {c1: 1, c2: 2, c3: 1, c4: null, c5: null, c6: 1, c7: 1, c8: null, c9: null}
    evidence:
      c1: "R1: RW 09 Kayu Putih flooding fell from 50-100 cm to about 20 cm and RT 02/06 stopped flooding after the pump house; recurrence is pre-intervention, so fewer events to score"
      c2: "R1 (Feb 2024): SCADA operational at Pulomas 2, pumps run from computer or phone, error reporting; plan 04 S6 lists Pulomas 2"
      c3: "Repo S2: Yos Sudarso 1 at 1.4 km (hydraulic link unconfirmed); R1: polder discharges to Kali Sunter, PA. Pulo Gadung on Sunter at 3.7 km"
      c6: "R1: inflow from IKIP, Pulo Nangka Barat and Pulomas Barat channels"
      c7: "R5 (Sep 2022): planned 5.5 m3/s total; R1 (Feb 2024): 3 pumps, figures internally inconsistent"
    score: 31.7
    potential_max: 56.7
    known_weight: 75
    confidence: medium
