watchlist:
  - id: tipala
    name: Rumah Pompa Tipala (Cipinang)
    reason: "Is an S1 post (R10) and is named as a SCADA implementation site (R9). Location and polder unknown; ask DSDA whether it serves a flood-prone polder"
  - id: pluit
    name: Polder Pluit
    reason: "S1/S2 post at the pump house (score c3 = 3), but very large, tidal and coastal; negative S2 values unexplained (G-043). Not recommended as a first lighthouse; ask DSDA"

