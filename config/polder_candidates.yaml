# Polder readiness scorecard, machine-readable (B-042, G-056).
# Human-readable version and reasoning: docs/readiness/polder_scorecard.md
# Status: DRAFT v0.1. The lighthouse choice is made with DSDA in Week 1; this file only informs it.
# Rules: a score is an integer 0..3 or null. null means "unknown - ask DSDA/BPBD"; it is never guessed.
# Every non-null score cites at least one entry in `sources` (or `plan` / `repo` evidence).
# Coordinates are approximate reference points from OpenStreetMap Nominatim (ODbL), not polder
# boundaries; they are used only to measure distance to S1/S2 posts. Replace with S8 polygons.

version: "0.1.0"
status: draft
computed_on: "2026-11-02"
author: hydro-ml-engineer (agent), for review by Ari and DSDA
decision_owner: "Ari + DSDA, Week 1 (see 01_PRODUCT_BRIEF.md Scope)"

scoring:
  scale: "0..3 per criterion; null = unknown"
  formula: "score = sum(weight_i * s_i / 3) over criteria with s_i not null  (0..100)"
  potential_max: "score + sum(weight_i) over criteria with s_i null  (upper bound if every unknown turns out best)"
  confidence: "known_weight / 100; high >= 0.8, medium 0.6..0.8, low < 0.6"
  ranking: "sort by score desc; tie-break 1: SCADA (c2) desc; tie-break 2: potential_max desc"
  ranking_confidence: "low - top three are within 2 points while 25 of 100 weight (incl. operator willingness) is unknown for all"
  gates:
    - id: g1
      rule: "DSDA confirms an operator contact willing to take shadow-mode recommendations (c8 >= 2)"
    - id: g2
      rule: "At least one usable water-level signal: SCADA sump level (c2 >= 2) or a relevant S1 post (c3 >= 2)"
    - id: g3
      rule: "Polder boundary obtainable by end of W2: S8 polygon or documented manual digitizing (c6 >= 1)"
  portfolio_rule: >
    Choose 2 to 3 polders. At least one must have confirmed SCADA (needed for M3 calibration).
    Prefer polders whose nearest S1 posts differ, so the evaluation is not driven by one gauge.

criteria:
  - id: c1
    name: Flood frequency and impact history
    source_ref: [S4, S15]
    weight: 20
    levels:
      3: "BPBD S4 archive shows flooded RTs in the polder in at least 3 of the last 5 wet seasons"
      2: "Official or press reports of recurring flooding in at least 2 different years since 2020 (proxy until S4 archive)"
      1: "A single dated report since 2020, or recurring flooding reported only before an intervention"
      0: "No flood reports in S4 archive 2020-2026"
  - id: c2
    name: SCADA presence and access prospect
    source_ref: [S6]
    weight: 20
    levels:
      3: "SCADA confirmed by DSDA, at least one wet season of logs, read-only access agreed"
      2: "SCADA at the pump house confirmed by an official or press source"
      1: "Listed as a SCADA example in plan 04 S6 only, not publicly confirmed"
      0: "DSDA confirms no SCADA"
  - id: c3
    name: TMA water-level post coverage (S1/S2)
    source_ref: [S1, S2]
    weight: 15
    levels:
      3: "S1 post at the polder's own pump house or outfall"
      2: "S1 post within 3 km on a channel the polder is documented to drain to"
      1: "S1 post within 6 km, hydraulic link not confirmed"
      0: "No S1 post within 6 km"
  - id: c4
    name: Rain gauge (ARR) coverage
    source_ref: [S3]
    weight: 5
    levels:
      3: "ARR inside the polder with 5-min archive"
      2: "ARR within 3 km"
      1: "ARR within 6 km"
      0: "None within 6 km"
  - id: c5
    name: CCTV with visible staff gauge or fixed reference
    source_ref: [S12]
    weight: 5
    levels:
      3: "Camera at pump house or flood hotspot with staff gauge visible, day and night"
      2: "Camera at hotspot with a fixed reference (wall, kerb) but no gauge"
      1: "Camera nearby, no usable reference"
      0: "No camera"
  - id: c6
    name: Polder boundary data
    source_ref: [S8]
    weight: 10
    levels:
      3: "Official polygon (SIGA/MAPID) delivered"
      2: "DSDA confirms an official polygon exists and will be shared"
      1: "Published catchment description (area, inflow channels, kelurahan) good enough for documented manual digitizing"
      0: "Nothing"
  - id: c7
    name: Pump inventory per pump house
    source_ref: [S7]
    weight: 10
    levels:
      3: "Official per-house inventory (count, capacity m3/s, status) from DSDA"
      2: "Public per-unit capacities dated within 3 years and internally consistent"
      1: "Public figures that are older, planned, partial or inconsistent"
      0: "Nothing"
  - id: c8
    name: DSDA and pump-house operator willingness
    source_ref: [DSDA]
    weight: 10
    levels:
      3: "Named operator and Sudin SDA contact agreed to shadow mode and weekly feedback"
      2: "DSDA nominates the polder"
      1: "DSDA neutral"
      0: "DSDA declines"
  - id: c9
    name: Exposure (population, critical facilities)
    source_ref: [S14]
    weight: 5
    levels:
      3: "Top tercile of DKI kelurahan by population in flood-prone area"
      2: "Middle tercile"
      1: "Bottom tercile"
      0: "Negligible"
    note: "Computable in W2 from S14 (B-059); null until then for all candidates"

