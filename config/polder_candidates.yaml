      c2: "Plan 04 S6 lists Sunter Selatan; R3: Sunter C has a digital system to monitor each pump in real time (not named SCADA)"
      c3: "Repo S2: Yos Sudarso 1 at 1.3 km (hydraulic link unconfirmed)"
      c6: "R3: served kelurahan named (Sunter Agung, Sungai Bambu)"
      c7: "R3: Sunter C 3 x 2.0 m3/s + 0.25 m3/s sludge pump (2025); Sunter Selatan's own pumps unknown"
    score: 31.7
    potential_max: 56.7
    known_weight: 75
    confidence: medium
  - id: setiabudi_timur
    name: Polder Setiabudi Timur (Waduk Setiabudi Timur)
    in_plan: true
    admin: "Guntur / Setiabudi, Jakarta Selatan"
    ref_point: {lat: -6.20517, lon: 106.82936, source: osm_nominatim, label: "Waduk Setia Budi Timur"}
    nearest_posts_km:
      - {post: "PA. Manggarai", river: "Ciliwung", km: 2.1}
      - {post: "P.A. Karet", river: "Banjir Kanal Barat", km: 2.3}
    scores: {c1: 1, c2: 1, c3: 2, c4: null, c5: null, c6: 1, c7: 1, c8: null, c9: null}
    evidence:
      c1: "R4 (2018): called a vulnerable point; R8: 40 cm on Jl. HR Rasuna Said, Kuningan, 7 Jul 2025 (inside the catchment per R4, not confirmed as polder failure)"
      c2: "Plan 04 S6 lists Setiabudi Timur; no public confirmation found"
      c3: "R4: pumps discharge to Banjir Kanal Barat; repo S2: P.A. Karet (BKB) at 2.3 km with Siaga history in Jan 2020; Manggarai 2.1 km upstream of the BKB split"
      c6: "R4: about 134 ha; inflow from Halimun, Menteng Atas, Pancoran, Kuningan"
