# Pre-commit hooks (guardrail 10). Install once per clone:
#   pip install pre-commit && pre-commit install
# gitleaks reads .gitleaks.toml. CI runs the same scan over the full history.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      # Keeps model weights, datasets and videos out of git (G-076, G-104).
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: noah-guardrails
        name: Noah guardrail checks (Math.random, np.random, deny-list)
        entry: node scripts/check-guardrails.mjs
        language: system
        pass_filenames: false
        always_run: true
